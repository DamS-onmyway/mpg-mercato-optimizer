name: Synchroniser les blessures MPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6,12,18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Synchroniser Foot Direct
        run: python scripts/sync_blessures.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blessures-public.json
          git diff --cached --quiet || git commit -m "Mise à jour automatique des blessures"

      - name: Mettre à jour la branche avant publication
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Publier les données
        run: git push origin HEAD:main
